          - {type: milestone, period: "FY28.Q2", label: "Knowledge Base Launched"}
          - {type: milestone, period: "FY29.Q1", label: "Omnichannel Support Live"}
          - {type: milestone, period: "FY29.Q3", label: "Support Automation Rollout Complete"}

