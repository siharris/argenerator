[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argenerator"
version = "0.1.0"
description = "Render architecture roadmaps (YAML) to PowerPoint slides"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.2",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.scripts]
argenerator = "argenerator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["argenerator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
